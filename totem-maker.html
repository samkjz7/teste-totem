<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Hub - Totem Creator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5/build/md5.min.js"></script> 
    <script src="gif.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --dark-space: #0A0A10;
            --deep-purple: #7B42F6;
            --light-purple: #A78BFA;
            --glow-color: rgba(123, 66, 246, 0.2);
            --glass-bg: rgba(18, 18, 28, 0.6);
            --border-color: rgba(123, 66, 246, 0.2);
            --text-primary: #EDE9FE;
            --text-secondary: #A1A1AA;
            --input-bg: rgba(30, 30, 45, 0.7);
            --card-bg: rgba(22, 22, 34, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--dark-space);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image:
                radial-gradient(ellipse 40% 50% at 20% 0%, var(--glow-color), transparent),
                radial-gradient(ellipse 40% 50% at 80% 100%, var(--glow-color), transparent);
            background-attachment: fixed;
            overflow-y: auto;
        }

        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 40px 0;
        }

        .creator-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: clamp(20px, 4vw, 35px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s 0.2s backwards;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card-header { text-align: center; margin-bottom: 25px; }
        .card-header h1 { font-size: clamp(1.8rem, 7vw, 2.3rem); font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, #FFFFFF, #D1C4E9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .card-header h1 span { background: linear-gradient(90deg, var(--light-purple), var(--deep-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-header p { color: var(--text-secondary); font-size: clamp(0.9rem, 3vw, 1rem); }
        
        .input-group { margin-bottom: 18px; }
        .label-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .label-wrapper .actions { display: flex; gap: 5px; }
        label { font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); }

        .file-input-wrapper {
            position: relative; background: var(--input-bg); border: 1px dashed var(--border-color); border-radius: 12px;
            padding: 15px; display: flex; align-items: center; cursor: pointer; transition: background-color 0.3s, border-color 0.3s;
            min-height: 80px;
        }
        .file-input-wrapper:hover { background-color: rgba(30, 30, 45, 1); border-color: var(--light-purple); }
        input[type="file"] { position: absolute; width: 100%; height: 100%; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .file-input-wrapper img { width: 50px; height: 50px; margin-right: 15px; object-fit: contain; background: rgba(0,0,0,0.2); border-radius: 8px; flex-shrink: 0; transition: transform 0.3s ease; }
        .file-input-wrapper img.is-flipped { transform: scaleX(-1); }
        .file-input-text { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; flex: 1; }
        .file-input-text.selected { color: var(--text-primary); font-weight: 500; }
        
        input[type="text"] { width: 100%; padding: 16px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-primary); font-size: 1rem; font-family: 'Manrope', sans-serif; transition: border-color 0.3s, box-shadow 0.3s; }
        input[type="text"]:focus { outline: none; border-color: var(--light-purple); box-shadow: 0 0 10px var(--glow-color); }
        
        .settings-btn { background: none; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; opacity: 0.5; transition: opacity 0.3s, color 0.3s; color: var(--text-secondary); border-radius: 6px; min-width: 44px; min-height: 44px; }
        .settings-btn:hover { opacity: 1; }
        .settings-btn.active { opacity: 1; color: var(--light-purple); }
        .settings-btn svg, .settings-btn i { width: 22px; height: 22px; font-size: 20px; }

        .number-input-wrapper { display: flex; align-items: center; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s; }
        .number-input-wrapper:focus-within { border-color: var(--light-purple); box-shadow: 0 0 10px var(--glow-color); }
        input[type="number"] { width: 100%; padding: 16px; background: none; border: none; color: var(--text-primary); font-size: 1rem; font-family: 'Manrope', sans-serif; -moz-appearance: textfield; text-align: center; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"]:focus { outline: none; }
        .num-btn { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: none; padding: 0 20px; font-size: 1.5rem; font-weight: 600; cursor: pointer; align-self: stretch; transition: background-color 0.3s, color 0.3s; touch-action: manipulation; min-height: 60px; }
        .num-btn:hover { background: var(--deep-purple); color: white; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 16, 0.5); backdrop-filter: blur(8px);
            z-index: 2000; display: flex; justify-content: center; align-items: center;
            padding: 20px; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.is-open { opacity: 1; visibility: visible; }
        
        .modal-content {
            position: relative; width: 100%; max-width: 500px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 30px;
            transform: scale(0.95); transition: transform 0.3s ease;
        }
        .modal-overlay.is-open .modal-content { transform: scale(1); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 1.5rem; }
        .close-modal-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.8rem; cursor: pointer; transition: color 0.3s; padding: 5px; line-height: 1; }
        .close-modal-btn:hover { color: var(--text-primary); }

        .position-settings { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .slider-group { display: flex; align-items: center; gap: 15px; }
        .slider-group label { flex-basis: 30px; font-weight: 700; color: var(--text-primary); }
        .slider-group input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: var(--input-bg); border-radius: 5px; outline: none; transition: background 0.3s; }
        .slider-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: var(--light-purple); cursor: pointer; border-radius: 50%; border: 3px solid var(--dark-space); }
        .slider-group input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; background: var(--light-purple); cursor: pointer; border-radius: 50%; border: 3px solid var(--dark-space); }
        .slider-value { font-weight: 600; color: var(--text-secondary); min-width: 45px; text-align: right; }

        .download-btn { width: 100%; padding: 18px; margin-top: 25px; background: var(--deep-purple); color: var(--text-primary); border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform 0.3s ease, box-shadow 0.3s ease; box-shadow: 0 0 20px rgba(123, 66, 246, 0.4); min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .download-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 0 30px rgba(123, 66, 246, 0.6); }
        .download-btn:disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; }
        
        #status { text-align: center; margin-top: 20px; min-height: 22px; color: var(--light-purple); font-weight: 500; transition: color 0.3s; font-size: 0.95rem; padding: 0 10px; }
        
        .page-transition { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--deep-purple); z-index: 9999; transform-origin: bottom; pointer-events: none; }
        .page-transition.animate-in { transform: scaleY(1); animation: slideIn 0.5s ease-in-out forwards; }
        .page-transition.animate-out { transform: scaleY(0); animation: slideOut 0.5s ease-in-out forwards; }
        @keyframes slideIn { from { transform: scaleY(1); transform-origin: top; } to { transform: scaleY(0); transform-origin: top; } }
        @keyframes slideOut { from { transform: scaleY(0); transform-origin: bottom; } to { transform: scaleY(1); transform-origin: bottom; } }

        .back-to-hub { position: fixed; bottom: 25px; left: 25px; background: var(--deep-purple); color: var(--text-primary); padding: 12px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; z-index: 1001; box-shadow: 0 0 20px rgba(123, 66, 246, 0.4); transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .back-to-hub:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(123, 66, 246, 0.6); }

        .social-links { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 1000; }
        .social-icon { display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; color: var(--text-secondary); font-size: 1.5rem; text-decoration: none; transition: all 0.4s ease; backdrop-filter: blur(10px); }
        .social-icon:hover { color: var(--text-primary); background-color: var(--deep-purple); transform: translateY(-5px); box-shadow: 0 0 20px var(--glow-color); border-color: var(--light-purple); }
        
        #historyPanel, #fpsPreviewContainer {
            position: absolute; top: 0; left: calc(100% + 20px); width: 300px;
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 20px; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease; transform: translateX(20px);
            display: flex; flex-direction: column;
        }
        #historyPanel { max-height: 80vh; }
        #historyPanel.is-visible, #fpsPreviewContainer.is-visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
        
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .history-header h3 { font-size: 1.2rem; }
        #clearHistoryBtn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
        #historyList { list-style: none; overflow-y: auto; flex-grow: 1; }
        .history-item { display: flex; align-items: center; gap: 15px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; }
        .history-item:hover { background-color: var(--input-bg); }
        .history-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: contain; flex-shrink: 0; }
        .history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #noHistoryMessage { text-align: center; color: var(--text-secondary); padding: 20px 0; }
        
        #closePreviewBtn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; transition: color 0.2s; }
        #closePreviewBtn:hover { color: var(--text-primary); }
        #gifCanvas { width: 100%; border-radius: 8px; background-color: var(--input-bg); }

        @media (max-width: 1000px) {
             #historyPanel, #fpsPreviewContainer {
                position: static; transform: none; width: auto; margin-top: 20px;
             }
             #historyPanel { max-height: 300px; }
             #historyPanel.is-visible, #fpsPreviewContainer.is-visible { transform: none; }
        }
        @media (max-width: 480px) { .back-to-hub { padding: 10px 15px; font-size: 0.9rem; bottom: 15px; left: 15px; } .social-links { bottom: 15px; right: 15px; gap: 12px; } .social-icon { width: 45px; height: 45px; font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="page-transition" id="pageTransition"></div>
    <a href="index.html" class="back-to-hub nav-link"><i class="fas fa-arrow-left"></i> Voltar ao Hub</a>

    <div class="main-wrapper">
        <div class="creator-card">
            <div class="card-header">
                <h1>Luna <span>Totem Creator</span></h1>
                <p>Crie totens animados (GIF) ou estáticos (PNG/JPG).</p>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label>1. Escolha GIF ou Imagem</label>
                    <div class="actions">
                        <button class="settings-btn" id="flipBtn" title="Inverter Imagem/GIF"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="margin-left: -10px; margin-right: 2px;"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg></button>
                        <button class="settings-btn" id="openSettingsBtn" title="Configurações de Posição (Apenas GIF)"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.438.995s.145.755.438.995l1.003.827c.424.35.534.954.26 1.431l-1.296 2.247a1.125 1.125 0 01-1.37.49l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.063-.374-.313-.686-.645-.87a6.52 6.52 0 01-.22-.127c-.324-.196-.72-.257-1.075-.124l-1.217.456a1.125 1.125 0 01-1.37-.49l-1.296-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.437-.995s-.145-.755-.437-.995l-1.004-.827a1.125 1.125 0 01-.26-1.431l1.296-2.247a1.125 1.125 0 011.37-.49l1.217.456c.355.133.75.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg></button>
                        <button class="settings-btn" id="historyBtn" title="Histórico de Criações"><i class="fas fa-history"></i></button>
                    </div>
                </div>
                <div class="file-input-wrapper"><input type="file" id="gifFile" accept=".gif, .png, .jpg, .jpeg"><img id="gifPreview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Preview"><span id="gifFileName" class="file-input-text">Clique para selecionar um arquivo...</span></div>
            </div>
            <div class="input-group">
                <label>2. Escolha o Ícone do Pacote (PNG)</label>
                <div class="file-input-wrapper"><input type="file" id="packIcon" accept=".png"><img id="iconPreview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Icon Preview"><span id="iconFileName" class="file-input-text">Clique para selecionar um arquivo...</span></div>
            </div>
            <div class="input-group"><label for="packName">3. Dê um nome ao Pacote</label><input type="text" id="packName" placeholder="Ex: MeuTotem"></div>
            <div class="input-group">
                <div class="label-wrapper">
                    <label for="packFps">4. Defina o FPS (Apenas para GIF)</label>
                    <button class="settings-btn" id="previewFpsBtn" title="Pré-visualizar"><i class="fas fa-eye"></i></button>
                </div>
                <div class="number-input-wrapper">
                    <button class="num-btn" id="fps-decrement">-</button><input type="number" id="packFps" value="20" min="1" max="120"><button class="num-btn" id="fps-increment">+</button>
                </div>
            </div>
            <button id="downloadBtn" class="download-btn" disabled>Preencha todos os campos</button>
            <div id="status"></div>
        </div>

        <div id="historyPanel">
            <div class="history-header"><h3>Histórico</h3><button id="clearHistoryBtn">Limpar</button></div>
            <ul id="historyList"><li id="noHistoryMessage">Nenhum totem salvo ainda.</li></ul>
        </div>
        
        <div id="fpsPreviewContainer">
            <button id="closePreviewBtn">&times;</button>
            <canvas id="gifCanvas"></canvas>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal"><div class="modal-content"><div class="modal-header"><h2>Posição do Totem (1ª Pessoa)</h2><button class="close-modal-btn" id="closeSettingsBtn">&times;</button></div><div class="position-settings"><div class="slider-group"><label for="posX">X</label><input type="range" id="posX" min="-40" max="0" value="-23" step="0.1"><span class="slider-value" id="posXValue">-23.0</span></div><div class="slider-group"><label for="posY">Y</label><input type="range" id="posY" min="-10" max="20" value="6.8" step="0.1"><span class="slider-value" id="posYValue">6.8</span></div><div class="slider-group"><label for="posZ">Z</label><input type="range" id="posZ" min="0" max="20" value="11" step="0.1"><span class="slider-value" id="posZValue">11.0</span></div><div class="slider-group"><label for="scale">Escala</label><input type="range" id="scale" min="1" max="8" value="3.2" step="0.1"><span class="slider-value" id="scaleValue">3.2</span></div></div></div></div>
    <div class="social-links"><a href="https://www.tiktok.com/@spiritmcp" target="_blank" rel="noopener noreferrer" class="social-icon" title="TikTok"><i class="fab fa-tiktok"></i></a><a href="#" class="social-icon" title="Discord"><i class="fab fa-discord"></i></a></div>

    <script>

                zip.file('manifest.json', manifestContent); 
                zip.file('pack_icon.png', currentIconFile);

                statusDiv.textContent = 'Finalizando...';
                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a'); link.href = URL.createObjectURL(content); link.download = `${packNameSanitized || 'totem_luna'}.mcpack`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                
                statusDiv.textContent = `Pacote '${link.download}' criado com sucesso!`;
                statusDiv.style.color = '#4ade80';

            } catch (error) {
                console.error(error);
                const errorMessage = error.message || "Ocorreu um erro desconhecido.";
                statusDiv.textContent = `Erro: ${errorMessage}`;
                statusDiv.style.color = '#f87171';
            } finally {
                 validateInputs();
            }
        });
        
        const pageTransition = document.getElementById('pageTransition');
        window.addEventListener('load', async () => { 
            pageTransition.classList.add('animate-in');
            try {
                await initDB();
                renderHistory();
            } catch (error) {
                console.error("Falha ao iniciar o banco de dados do histórico:", error);
            }
        });
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault(); const destination = link.href;
                pageTransition.classList.add('animate-out');
                setTimeout(() => { window.location.href = destination; }, 500);
            });
        });
    </script>
</body>
</html>
